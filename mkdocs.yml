site_name: "Project Prometheus"
site_description: "Stealing fire from the gods of AI — one lesson at a time"
site_url: "https://b3nw00d6r00v3.github.io/project-prometheus/"
repo_url: "https://github.com/B3nW00d6r00v3/project-prometheus"
repo_name: "project-prometheus"

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/fire
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link

extra_css:
  - assets/css/custom.css

extra_javascript:
  - assets/js/progress.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

exclude_docs: |
  syllabus/drafts/
  syllabus/current/V3/00_inventar_*.md
  syllabus/current/V3/AI-Master-Curriculum_*.md
  syllabus/current/V3/KI-Meisterlehrplan_*.md

copyright: "KI-Meisterlehrplan v2.2.1 · Letzte Aktualisierung Mai 2026 · CC BY-SA 4.0"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/B3nW00d6r00v3

nav:
  - Home: index.md
  - "Start Here": start.md
  - Syllabus:
    - syllabus/index.md
    - "Lehrplan-Übersicht": syllabus/current/V3/000_master.md
    - Stufen:
      - "Stufe 1 — Onboarding & Mindset": syllabus/current/V3/01_stufe1.md
      - "Stufe 2 — Grundlagen": syllabus/current/V3/02_stufe2.md
      - "Stufe 3 — Arbeitsmethoden mit KI": syllabus/current/V3/03_stufe3.md
      - "Stufe 4 — Programmier-Foundation": syllabus/current/V3/04_stufe4.md
      - "Stufe 5 — Anwendungen bauen": syllabus/current/V3/05_stufe5.md
      - "Stufe 6 — Agenten": syllabus/current/V3/06_stufe6.md
      - "Stufe 7 — Deep Learning Foundations": syllabus/current/V3/07_stufe7.md
      - "Stufe 8 — Klassisches ML & Statistik": syllabus/current/V3/08_stufe8.md
      - "Stufe 9 — KI-Strategie & Business": syllabus/current/V3/09_stufe9.md
      - "Stufe 10 — Spezialisierung & Production": syllabus/current/V3/10_stufe10.md
      - "Stufe 11 — Forschung & Cutting-Edge": syllabus/current/V3/11_stufe11.md
    - Querschnitte:
      - "Math-Foundation": syllabus/current/V3/12_querschnitt_math.md
      - "Eval": syllabus/current/V3/13_querschnitt_eval.md
      - "Production & LLMOps": syllabus/current/V3/14_querschnitt_production.md
      - "AI Safety & Red-Teaming": syllabus/current/V3/16_querschnitt_safety.md
    - Capstones:
      - "Capstone A — Engineer": syllabus/current/V3/17_capstone_a_engineer.md
      - "Capstone B — Foundations": syllabus/current/V3/18_capstone_b_foundations.md
      - "Capstone C — Strategist": syllabus/current/V3/19_capstone_c_strategist.md
    - "Anhang": syllabus/current/V3/99_anhang.md
  - Tools: tools.md
  - Prompts: prompts.md
  - Glossar: glossary.md
  - Resources: resources.md
  - About: about.md
